<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Library · Lia Grigorian</title>
    <link rel="stylesheet" href="styles/style.css" />
    <style>
      /* ===================== PROJECT PAGE ===================== */
      .page {
        padding: 0 var(--pad);
      }
      .project {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        column-gap: var(--gap);
        align-items: start;
      }

      /* LEFT: stays fixed while the images scroll */
      .p-left {
        grid-column: 1/4;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 16px 0 20px;
      }
      .p-name a {
        text-decoration: none;
        white-space: nowrap;
      }
      .p-name a:hover {
        font-style: italic;
      }
      .p-main {
        margin-top: clamp(70px, 14vh, 150px);
      }
      .p-title {
        font-weight: 400;
        font-size: clamp(26px, 2.1vw, 34px);
        line-height: 1.1;
      }
      .p-sub {
        font-size: 14px;
        line-height: 1.2;
        margin-top: 3px;
      }
      .p-meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: var(--gap);
        margin-top: clamp(28px, 5vh, 52px);
        font-size: 14px;
      }
      .p-meta .m2 {
        grid-column: 2/4;
      }
      .p-text {
        margin-top: clamp(26px, 4.5vh, 48px);
        font-size: 14px;
        line-height: 1.3;
      }

      .p-other {
        margin-top: auto;
      }
      .p-other .labels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        column-gap: var(--gap);
        font-style: italic;
      }
      .p-other .labels .l2 {
        grid-column: 2/4;
      }
      .p-list {
        list-style: none;
        margin-top: clamp(28px, 6vh, 60px);
        font-size: clamp(16px, 1.3vw, 20px);
        line-height: 1.3;
      }
      .p-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .p-list a {
        text-decoration: none;
      }
      .p-list a:hover {
        text-decoration: underline;
        text-decoration-thickness: 0.06em;
        text-underline-offset: 0.12em;
      }
      .p-list em {
        white-space: nowrap;
      }

      /* RIGHT: images, flush to the top and right edge */
      .p-gallery {
        grid-column: 4/9;
        margin-right: calc(var(--pad) * -1);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .p-gallery figure {
        grid-column: span 1;
        margin: 0;
      }
      .p-gallery figure.wide {
        grid-column: 1/3;
      }
      .p-gallery img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: var(--grey);
        transform: scale(0.86);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* BOTTOM: only shows once you've scrolled all the way down */
      .p-foot {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        column-gap: var(--gap);
        padding: 16px 0;
        font-size: 13px;
      }
      .p-foot a {
        text-decoration: none;
      }
      .p-foot a:hover {
        font-style: italic;
      }
      .p-foot .back {
        grid-column: 1/3;
      }
      .p-foot .about {
        grid-column: 8/9;
      }

      @media (max-width: 720px) {
        .project {
          display: flex;
          flex-direction: column;
        }
        .p-left {
          display: contents;
        }
        .p-name {
          order: 1;
          padding-top: 16px;
        }
        .p-main {
          order: 2;
          margin-top: 44px;
        }
        .p-gallery {
          order: 3;
          margin: 32px calc(var(--pad) * -1) 0;
        }
        .p-other {
          order: 4;
          margin-top: 48px;
        }
        .p-foot {
          margin-top: 40px;
        }
        .p-foot .back {
          grid-column: 1/3;
        }
        .p-foot .about {
          grid-column: 3/5;
          justify-self: end;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .p-gallery img {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="project">
        <div class="p-left">
          <div class="p-name"><a href="index.html">Lia Grigorian——</a></div>

          <div class="p-main">
            <h1 class="p-title" id="pTitle"></h1>
            <p class="p-sub" id="pSub"></p>
            <div class="p-meta">
              <span id="pYear"></span><span class="m2" id="pDetails"></span>
            </div>
            <p class="p-text" id="pText"></p>
          </div>

          <div class="p-other">
            <div class="labels">
              <span>OTHER</span><span class="l2">WORKS</span>
            </div>
            <ul class="p-list">
              <li><a href="project-3.html">(1) NOJI</a><em>Branding</em></li>
              <li>
                <a href="project-1.html">(2) The Library</a><em>Editorial</em>
              </li>
              <li>
                <a href="project-4.html">(3) Capstone</a><em>Editorial</em>
              </li>
              <li><a href="#">(4) Another Project</a><em>Editorial</em></li>
            </ul>
          </div>
        </div>

        <div class="p-gallery" id="gallery"></div>
      </main>

      <footer class="p-foot">
        <a class="back" href="index.html">Back to Main?</a>
        <a class="about" href="about.html">Or about Lia?</a>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script>
      /* =====================================================
   CONTENT: edit this block for each project.
   To make another project page, copy this whole file
   (e.g. to project-2.html) and change only this block.
   img: "images/library-1.jpg"  (leave "" for a grey box)
   size: "wide" = full width, "half" = half width (two halves sit side by side)
   ratio: shape of the box, width / height
   ===================================================== */
      const PROJECT = {
        title: "The Library",
        sub: "Editorial Design",
        year: "2025",
        details: "Spreads (40), Covers (3)",
        text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
        images: [
          { img: "", size: "wide", ratio: 1.93 },
          { img: "", size: "half", ratio: 0.96 },
          { img: "", size: "half", ratio: 0.96 },
          { img: "", size: "wide", ratio: 1.59 },
        ],
      };

      const BLANK =
        "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
      document.getElementById("pTitle").textContent = PROJECT.title;
      document.getElementById("pSub").textContent = PROJECT.sub;
      document.getElementById("pYear").textContent = PROJECT.year;
      document.getElementById("pDetails").textContent = PROJECT.details;
      document.getElementById("pText").textContent = PROJECT.text;
      document.title = PROJECT.title + " · Lia Grigorian";

      const gallery = document.getElementById("gallery");
      PROJECT.images.forEach((p) => {
        const fig = document.createElement("figure");
        if (p.size === "wide") fig.className = "wide";
        fig.style.aspectRatio = p.ratio;
        const im = document.createElement("img");
        im.alt = PROJECT.title;
        im.src = p.img || BLANK;
        fig.appendChild(im);
        gallery.appendChild(fig);
      });

      /* ===== SMOOTH SCROLL ===== */
      if (
        typeof Lenis !== "undefined" &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        const lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
        const tick = (t) => {
          lenis.raf(t);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      /* ===== IMAGES POP IN SLOWLY AS YOU SCROLL =====
   Each image grows from a little smaller and fades in as it rises into view. */
      const POP_FROM = 0.86; // starting size (1 = full size). Lower = bigger pop
      const POP_EASE = 0.07; // lower = slower, floatier
      const POP_AT = 0.55; // how far up the screen an image gets before it's fully in
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const items = [...gallery.querySelectorAll("figure")].map((f) => ({
          f,
          img: f.firstChild,
          cur: 0,
        }));
        (function loop() {
          const vh = innerHeight;
          items.forEach((it) => {
            const top = it.f.getBoundingClientRect().top;
            let t = Math.max(0, Math.min(1, (vh - top) / (vh * POP_AT)));
            const target = t * t * (3 - 2 * t);
            it.cur += (target - it.cur) * POP_EASE;
            it.img.style.transform = `scale(${POP_FROM + (1 - POP_FROM) * it.cur})`;
            it.img.style.opacity = it.cur;
          });
          requestAnimationFrame(loop);
        })();
      }

      /* ===== CURSOR TRAIL ===== */
      const WORD = "take your time"; // change the word here
      const EASE = 0.3;
      const FLOAT = 1.5;
      const SPEED = 0.0006;
      const WAVE = 0.35;

      if (
        matchMedia("(hover:hover)").matches &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        const letters = [...WORD].map((ch) => {
          const el = document.createElement("span");
          el.className = "cursor-letter";
          el.textContent = ch;
          document.body.appendChild(el);
          return { el, x: 0, y: 0, w: el.getBoundingClientRect().width };
        });
        let mx = 0,
          my = 0,
          started = false;
        const show = (on) =>
          letters.forEach((l) => (l.el.style.opacity = on ? 1 : 0));

        window.addEventListener("mousemove", (e) => {
          mx = e.clientX + 16;
          my = e.clientY + 16;
          if (!started || letters.some((l) => !l.w)) {
            letters.forEach((l) => (l.w = l.el.getBoundingClientRect().width));
            let x = mx;
            letters.forEach((l) => {
              l.x = x;
              l.y = my;
              x += l.w;
            });
            started = letters.every((l) => l.w > 0);
          }
          show(true);
        });
        document.addEventListener("mouseleave", () => show(false));

        (function tick(t) {
          letters.forEach((l, i) => {
            const p = letters[i - 1];
            const tx = i === 0 ? mx : p.x + p.w;
            const ty = i === 0 ? my : p.y;
            l.x += (tx - l.x) * EASE;
            l.y += (ty - l.y) * EASE;
            const bob = Math.sin(t * SPEED * 2 * Math.PI + i * WAVE) * FLOAT;
            l.el.style.transform = `translate(${l.x}px,${l.y + bob}px)`;
          });
          requestAnimationFrame(tick);
        })(0);
      }
    </script>
  </body>
</html>
